[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-polizas"
version = "1.0.0"
description = "Asistente de Consulta de Pólizas: agente conversacional construido con Google ADK sobre Gemini."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Lab - Seguros Bolívar" }]
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "google-cloud-firestore>=2.16.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["agente_polizas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "load-tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
