# Pipeline de construcción y despliegue en Cloud Run.
#
# Ejecución manual:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_PROJECT_ID=<proyecto>,_REGION=us-central1,_TAG=v1.1.0
#
# Requiere:
#   - Repositorio de Artifact Registry ${_AR_REPO} (formato Docker) en ${_REGION}.
#   - Cuenta de servicio de ejecución ${_RUNTIME_SA} con roles/datastore.viewer,
#     roles/aiplatform.user y roles/cloudtrace.agent.

substitutions:
  _PROJECT_ID: "proyecto-ai-lab"
  _REGION: "us-central1"
  _AR_REPO: "agentes"
  _SERVICE: "agente-polizas"
  _TAG: "latest"
  _RUNTIME_SA: "sa-agente-polizas"
  _MODEL: "gemini-2.5-flash"
  _FIRESTORE_COLLECTION: "polizas"
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "10"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  - id: tests
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet ".[dev]" && ruff check . && pytest

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - .
    waitFor: ["tests"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - --service-account=${_RUNTIME_SA}@${_PROJECT_ID}.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --ingress=internal-and-cloud-load-balancing
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=40
      - --timeout=60
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu-boost
      - --labels=iniciativa=agente-polizas,equipo=ai-lab,criticidad=media
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,MODEL=${_MODEL},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION},REPOSITORY_BACKEND=firestore,LOG_LEVEL=INFO,TRACE_TO_CLOUD=true

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
